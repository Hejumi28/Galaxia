<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Girasoles y Flores - Para Ti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030206;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
            user-select: none;
        }

        #webgl {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Indicador de ayuda superior */
        .instruction {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff;
            z-index: 10;
            pointer-events: none;
            text-transform: uppercase;
        }

        /* Botón de control de audio en la esquina */
        .music-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(20, 15, 35, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            transform: scale(1.1);
            border-color: #fef08a;
        }

        /* Contenedor central flotante (Foto + Texto juntos) */
        .center-container {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            width: 90%;
            max-width: 420px;
        }

        /* Marco de la imagen central */
        .center-card {
            width: 220px;
            height: 220px;
            border-radius: 20px;
            border: 2px solid #ffffff;
            box-shadow: 0 0 25px #ffffff, 0 0 50px rgba(255, 255, 255, 0.6);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .center-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Estilo cuando es la última escena (sin imagen central) */
        .center-container.final-stage .center-card {
            display: none;
        }

        /* Texto Flotante */
        .floating-text {
            margin-top: 18px;
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.6;
            color: #ffffff;
            text-align: center;
            width: 100%;
            padding: 16px 20px;
            background: rgba(20, 15, 35, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.3);
            animation: floatText 3s infinite ease-in-out;
        }

        .center-container.final-stage .floating-text {
            font-size: 1.02rem;
            line-height: 1.7;
            color: #fef08a;
            border: 1px solid rgba(234, 179, 8, 0.8);
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.5);
            background: rgba(35, 25, 10, 0.85);
        }

        .heart-icon {
            display: none;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-align: center;
            filter: drop-shadow(0 0 10px rgba(234, 179, 8, 0.9));
            animation: heartbeat 2s infinite ease-in-out;
        }

        .center-container.final-stage .heart-icon {
            display: block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .fade-out {
            opacity: 0;
            transform: translate(-50%, -55%) scale(0.9) !important;
        }
    </style>
    <!-- Librerías Three.js para la galaxia 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="instruction">✨ Toca en cualquier parte para avanzar ✨</div>
    <div id="webgl"></div>

    <!-- Etiqueta de audio oculta -->
    <audio id="bgMusic" src="faltas_tu.mp3"></audio>

    <!-- Botón para pausar/reproducir música -->
    <button class="music-btn" id="musicBtn" title="Activar/Desactivar música">🎵</button>

    <!-- Contenedor central con la foto y su texto flotante integrados -->
    <div class="center-container" id="centerContainer">
        <div class="center-card" id="cardBox">
            <img id="mainImg" src="" alt="Amor">
        </div>
        <div class="floating-text" id="mainText">
            <div class="heart-icon">🌻💛🌻</div>
            <span id="textContent"></span>
        </div>
    </div>

    <script>
        // --- CONTROL DE REPRODUCCIÓN CONTINUA DE LAS DOS CANCIONES ---
        const playlist = [
            "faltas_tu.mp3",
            "porfa_no_te_vayas.mp3"
        ];
        let currentSongIndex = 0;

        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isMusicPlaying = false;

        function loadAndPlaySong(index) {
            bgMusic.src = playlist[index];
            bgMusic.play().then(() => {
                musicBtn.innerText = '🎵';
                isMusicPlaying = true;
            }).catch(err => {
                console.log("Esperando interacción del usuario...");
            });
        }

        // Cuando termina una canción, pasa automáticamente a la siguiente
        bgMusic.addEventListener('ended', () => {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadAndPlaySong(currentSongIndex);
        });

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicBtn.innerText = '🔇';
                isMusicPlaying = false;
            } else {
                if (!bgMusic.src || bgMusic.src === "") {
                    loadAndPlaySong(currentSongIndex);
                } else {
                    bgMusic.play().then(() => {
                        musicBtn.innerText = '🎵';
                        isMusicPlaying = true;
                    }).catch(err => {
                        console.log("Esperando interacción del usuario...");
                    });
                }
            }
        }

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Evita avanzar de foto al tocar el botón de música
            toggleMusic();
        });

        // --- 1. HISTORIA DE FOTOS Y MENSAJES ---
        const history = [
            { 
                text: "Hola, sé que es difícil y puede no estar bien, pero perdón. No quiero dejar así las cosas, ya sé que tú dices que no se puede, pero no quiero.", 
                img: "foto1.jpeg" 
            },
            { 
                text: "Esto no es para hacerte sentir mal ni nada, es solo un pequeño detalle que te quería dar. No será la gran cosa, pero es algo desde el fondo de mi corazón.", 
                img: "foto2.jpeg" 
            },
            { 
                text: "Todos aquellos momentos que vivimos juntos, conocernos y enseñarnos, no quiero que nada de eso se acabe.", 
                img: "foto3.jpeg" 
            },
            { 
                text: "Puede que ahorita las cosas no sean igual, pero entonces aprendamos otra vez y enseñémonos otra vez los dos.", 
                img: "foto4.jpeg" 
            },
            { 
                text: "Puede ser egoísta de mi parte, pero no quiero que nada de esto se acabe: los pequeños y grandes detalles, las salidas y todo lo que llegamos a vivir juntos.", 
                img: "foto5.jpeg" 
            },
            { 
                text: "Un viaje como este puede que no haya sido el mejor, pero fue una gran experiencia, nuestro primer viaje juntos, y quiero que hayan muchos más viajes así.", 
                img: "foto6.jpeg" 
            },
            { 
                text: "Yo sé que es difícil y como tú dices ya no me amas como antes, pero déjame demostrarte que los dos podemos mejorar y te volveré a enamorar día tras día. Puede que las cosas no vayan a ser iguales, ¿pero qué importa? Hagamos nuestra propia historia y lo más importante: estemos juntos, aprendamos más uno del otro y de la vida, mejoremos.", 
                img: "foto7.jpeg" 
            },
            { 
                text: "Y te entediendo no te voy a pedir obviamente que no te ames a ti misma que esto es lo mejor para los dos y que es es por tu bien. Yo se que no e sido el mejor y no me voy a justificar por todo lo que hice la embarre feo y no tuve que ser asi nadie se merece que la traten asi no mas en el viaje lo que te hice esa noche no apoyarte no me voy a justificar pero estaba mal con lo que paso con lo de mis papas me sentia raro por que jhon estaba ahi y recorde mucho viajes pasados con mis papas y lo de mi tia nose aun asi no era para hacer lo que hice. Las veces que te trate mal o hable feo te pido perdon y creeme que no lo hacia de mala manera por los mismos problema estaba como cegado y por confianza era normal hablar asi. Obvio que no es normal y no mereces ese trato. Pero ya como que lo comprendi y queria cambiar y lo estaba intentando. Que la relacion se volvierq monotona fue mi culpa estaba tan bien contigo que me gustaba nose solo no mas estar contigo pero entiendo que no debe ser asi del todo toca salir y tengo que planear mas cosas. Los viajes que tuvimos fueron tan lindos a santa marta, cachipay todas las veces que fuimos, a guatavita, viajes con mi familia y cualquier salida contigo era feliz y todas los viajes que queria hacer al eje cafetero, a bojaca a vendecir las motos. Muchas cosas pero lastimosamente pensaba que neceistaba plata y no la tenia en esos momentos. Y nose no te estoy pidiendo que si enserio eras infeliz conmigo y no te haga feliz ya pues entiendo tu decisión  pero yo no te puedo prometer que voy a cambiar asi y ya tan facil no va a ser facil y entiendo que no creas en mi promesas pero si quiero intentarlo quiero demostarte que te puedo amar mucho mas puede que no mas que tu pero lo intentare porque tu te amas demasiado y eso es lo que me encantaba de ti. Y pues como te digo puede que sonara canson y todo pero espero que pensaras bien las cosas, no se sentía que no podia ser asi sin mas y si yo se que esto viene desde antes y todo pero enserio que es lo que tu quieres que quiere ese corazon tan bello que tienes. Y no es que piensen los demas que opinas tu es lo importante porque a fin de cuentas somos los dos y nuestros problemas. Y si puede que ya hayamos terminado pero una parte de mi pensaba que no era real.", 
                img: "foto8.jpeg" 
            },
            { 
                text: "No sé si esto te haga cambiar de opinión o si hayas logrado pensar bien las cosas, pero yo no quiero que esto quede así. No dejemos que acabe así. Puede que me hayas dicho que ya no lo quieres intentar por lo anterior, pero ¿enserio es lo que quieres?, ¿sí pensaste bien lo que tú querías?, ¿por qué no avanzar los dos y descubrir más cosas los dos? Te amo mucho muchote.", 
                img: "foto9.jpeg" 
            },
            { 
                text: "Y desde el fondo de mi corazón, puede que yo no sea el mejor hombre, novio y todo lo que pueda ser, pero nada es perfecto, solo tenemos que aprender y mejorar. Puede que no tenga el amor propio que necesito, pero es algo complicado y pues para un hombre es normal no tener casi amor propio, uno no quiere hacer las cosas por uno mismo, y sí, eso se puede cambiar, pero no es sencillo. Es más sencillo cuando uno cambia por alguien importante para uno y así ya este mejorando para mí mismo y empezará a mejorar más por mí mismo también quiero mejorar por ti. Entonces, déjame aprender a tu lado. No dire mas por aca entonces te lo dire yo mismo.", 
                img: null 
            }
        ];

        let currentIndex = 0;
        const mainImg = document.getElementById('mainImg');
        const textContent = document.getElementById('textContent');
        const centerContainer = document.getElementById('centerContainer');

        function updateContent() {
            const currentItem = history[currentIndex];
            
            if (currentItem.img) {
                centerContainer.classList.remove('final-stage');
                mainImg.src = currentItem.img;
            } else {
                centerContainer.classList.add('final-stage');
            }
            
            textContent.innerText = currentItem.text;
        }
        updateContent();

        window.addEventListener('click', () => {
            // Iniciar reproducción de la música en la primera interacción si no está sonando
            if (!isMusicPlaying) {
                toggleMusic();
            }

            centerContainer.classList.add('fade-out');

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % history.length;
                updateContent();
                centerContainer.classList.remove('fade-out');
            }, 350);
        });

        // --- 2. ESCENA 3D ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030206, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('webgl').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;

        // --- 3. GALAXIA DE ESTRELLAS CÁLIDAS ---
        function createGalaxy() {
            const count = 6500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            
            const colorYellow = new THREE.Color('#fef08a');
            const colorWhite = new THREE.Color('#ffffff');

            for (let i = 0; i < count; i++) {
                if (i < count / 2) {
                    const t = Math.random() * Math.PI * 2;
                    let x = 16 * Math.pow(Math.sin(t), 3);
                    let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    const scale = 0.38;
                    positions[i * 3] = x * scale + (Math.random() - 0.5) * 1.2;
                    positions[i * 3 + 1] = y * scale + 6 + (Math.random() - 0.5) * 1.2;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 2;
                } else {
                    const radius = Math.random() * 20;
                    const spinAngle = radius * 0.8;
                    const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

                    positions[i * 3] = Math.cos(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 1.2;
                    positions[i * 3 + 1] = -4 + (Math.random() - 0.5) * 2;
                    positions[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 1.2;
                }

                const mixedColor = Math.random() > 0.4 ? colorYellow : colorWhite;
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geometry, new THREE.PointsMaterial({
                size: 0.13,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            }));
        }

        const galaxyPoints = createGalaxy();
        scene.add(galaxyPoints);

        // --- 4. CREADOR DE TEXTURA DE GIRASOL REAL (CANVAS 2D DIBUJADO A DETALLE) ---
        function generateSunflowerTexture(type = 'sunflower') {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const cx = 256;
            const cy = 256;

            if (type === 'sunflower') {
                const petals = 28;
                for (let i = 0; i < petals; i++) {
                    const angle = (i / petals) * Math.PI * 2;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(angle);

                    const grad = ctx.createLinearGradient(0, 0, 0, -220);
                    grad.addColorStop(0, '#f59e0b');
                    grad.addColorStop(0.5, '#fbbf24');
                    grad.addColorStop(1, '#fef08a');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, -40);
                    ctx.quadraticCurveTo(35, -130, 0, -230);
                    ctx.quadraticCurveTo(-35, -130, 0, -40);
                    ctx.fill();
                    ctx.restore();
                }

                const centerGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 75);
                centerGrad.addColorStop(0, '#271202');
                centerGrad.addColorStop(0.7, '#451a03');
                centerGrad.addColorStop(1, '#78350f');

                ctx.fillStyle = centerGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, 75, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fbbf24';
                for (let j = 0; j < 120; j++) {
                    const r = Math.sqrt(j) * 6.5;
                    const theta = j * 137.5 * (Math.PI / 180);
                    const x = cx + r * Math.cos(theta);
                    const y = cy + r * Math.sin(theta);
                    ctx.beginPath();
                    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                const petals = 24;
                for (let i = 0; i < petals; i++) {
                    const angle = (i / petals) * Math.PI * 2;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(angle);

                    const grad = ctx.createLinearGradient(0, 0, 0, -210);
                    grad.addColorStop(0, '#e2e8f0');
                    grad.addColorStop(1, '#ffffff');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, -35);
                    ctx.quadraticCurveTo(28, -120, 0, -220);
                    ctx.quadraticCurveTo(-28, -120, 0, -35);
                    ctx.fill();
                    ctx.restore();
                }

                const centerGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 55);
                centerGrad.addColorStop(0, '#fef08a');
                centerGrad.addColorStop(0.8, '#eab308');
                centerGrad.addColorStop(1, '#ca8a04');

                ctx.fillStyle = centerGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, 55, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // --- 5. AÑADIR GIRASOLES Y FLORES EN ÓRBITA ---
        const groupPhotos = new THREE.Group();
        scene.add(groupPhotos);

        const photoMeshes = [];
        const radiusRing = 13;
        const totalFlowers = 10;

        const textureSunflower = generateSunflowerTexture('sunflower');
        const textureDaisy = generateSunflowerTexture('daisy');

        for (let index = 0; index < totalFlowers; index++) {
            const angle = (index / totalFlowers) * Math.PI * 2;
            const geometry = new THREE.PlaneGeometry(3.5, 3.5);

            const texture = index % 3 === 0 ? textureDaisy : textureSunflower;

            const material = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.95
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.x = Math.cos(angle) * radiusRing;
            mesh.position.z = Math.sin(angle) * radiusRing;
            mesh.position.y = Math.sin(index) * 1.8;
            mesh.lookAt(0, mesh.position.y, 0);
            mesh.userData = { originalY: mesh.position.y };

            groupPhotos.add(mesh);
            photoMeshes.push(mesh);
        }

        // --- 6. ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);

            galaxyPoints.rotation.y += 0.0018;
            groupPhotos.rotation.y += 0.0022;

            const time = Date.now() * 0.0015;
            photoMeshes.forEach((mesh, i) => {
                mesh.position.y = mesh.userData.originalY + Math.sin(time + i) * 0.35;
                mesh.rotation.z += 0.003;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
