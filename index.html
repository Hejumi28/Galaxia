<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Girasoles y Flores - Para Ti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030206;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #webgl {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Contenedor del indicador de ayuda superior */
        .instruction-container {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
            pointer-events: none;
            padding: 0 15px;
        }

        .instruction {
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff;
            text-transform: uppercase;
        }

        .warning-instruction {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fef08a;
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.8);
            background: rgba(20, 15, 35, 0.75);
            padding: 6px 14px;
            border-radius: 12px;
            border: 1px solid rgba(234, 179, 8, 0.5);
            backdrop-filter: blur(6px);
            max-width: 90%;
        }

        /* Botón de control de audio en la esquina */
        .music-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(20, 15, 35, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            transform: scale(1.1);
            border-color: #fef08a;
        }

        /* Contenedor central flotante (Foto + Texto juntos) */
        .center-container {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            width: 90%;
            max-width: 420px;
        }

        /* Marco de la imagen central */
        .center-card {
            width: 200px;
            height: 200px;
            border-radius: 20px;
            border: 2px solid #ffffff;
            box-shadow: 0 0 25px #ffffff, 0 0 50px rgba(255, 255, 255, 0.6);
            overflow: hidden;
            transition: all 0.3s ease;
            background-color: #030206;
            flex-shrink: 0;
        }

        .center-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Estilo cuando es la última escena (sin imagen central) */
        .center-container.final-stage .center-card {
            display: none;
        }

        /* Texto Flotante */
        .floating-text {
            margin-top: 14px;
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.6;
            color: #ffffff;
            text-align: center;
            width: 100%;
            padding: 16px 20px;
            background: rgba(20, 15, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.3);
            animation: floatText 3s infinite ease-in-out;
            max-height: 38vh;
            overflow-y: auto;
            white-space: pre-line;
        }

        .center-container.final-stage .floating-text {
            font-size: 1.02rem;
            line-height: 1.7;
            color: #fef08a;
            border: 1px solid rgba(234, 179, 8, 0.8);
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.5);
            background: rgba(35, 25, 10, 0.85);
        }

        .heart-icon {
            display: none;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-align: center;
            filter: drop-shadow(0 0 10px rgba(234, 179, 8, 0.9));
            animation: heartbeat 2s infinite ease-in-out;
        }

        .center-container.final-stage .heart-icon {
            display: block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .fade-out {
            opacity: 0;
            transform: translate(-50%, -55%) scale(0.9) !important;
        }
    </style>
    <!-- Librerías Three.js para la galaxia 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="instruction-container">
        <div class="instruction">✨ TOCA EN CUALQUIER PARTE PARA AVANZAR ✨</div>
        <div class="warning-instruction">⚠️ No tocar hasta terminar de leer y si cambia sin haber leído completo reinicia y no leas la siguiente</div>
    </div>

    <div id="webgl"></div>

    <!-- Etiqueta de audio oculta -->
    <audio id="bgMusic" src="faltas_tu.mp3" playsinline></audio>

    <!-- Botón para pausar/reproducir música -->
    <button class="music-btn" id="musicBtn" title="Activar/Desactivar música">🎵</button>

    <!-- Contenedor central con la foto y su texto flotante integrados -->
    <div class="center-container" id="centerContainer">
        <div class="center-card" id="cardBox">
            <img id="mainImg" src="foto1.jpeg" alt="Foto de recuerdo">
        </div>
        <div class="floating-text" id="mainText">
            <div class="heart-icon">🌻💛🌻</div>
            <span id="textContent"></span>
        </div>
    </div>

    <script>
        // --- CONTROL DE REPRODUCCIÓN CONTINUA DE LAS DOS CANCIONES ---
        const playlist = [
            "faltas_tu.mp3",
            "porfa_no_te_vayas.mp3"
        ];
        let currentSongIndex = 0;

        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isMusicPlaying = false;

        // Bajar el volumen por defecto al 30%
        bgMusic.volume = 0.3;

        function loadAndPlaySong(index) {
            bgMusic.src = playlist[index];
            bgMusic.volume = 0.3;
            bgMusic.play().then(() => {
                musicBtn.innerText = '🎵';
                isMusicPlaying = true;
            }).catch(err => {
                console.log("Esperando interacción del usuario...");
            });
        }

        bgMusic.addEventListener('ended', () => {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadAndPlaySong(currentSongIndex);
        });

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicBtn.innerText = '🔇';
                isMusicPlaying = false;
            } else {
                if (!bgMusic.src || bgMusic.src === "" || bgMusic.src.endsWith("undefined")) {
                    loadAndPlaySong(currentSongIndex);
                } else {
                    bgMusic.volume = 0.3;
                    bgMusic.play().then(() => {
                        musicBtn.innerText = '🎵';
                        isMusicPlaying = true;
                    }).catch(err => {
                        console.log("Esperando interacción del usuario...");
                    });
                }
            }
        }

        musicBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            toggleMusic();
        });

        // --- 1. HISTORIA DE FOTOS Y MENSAJES (TEXTO EXACTO ORIGINAL) ---
        const history = [
            { 
                text: "Hola mi amor, feliz día de amor y amistad muchas gracias por todo en serio eres una mujer maravillosa que ha pasado por muchas cosas en la vida y que le quedan muchas más por recorrer y estoy muy agradecido por tu llegada a mi vida fuiste una gran bendición me has ayudado muchísimo has estado para mi siempre que lo he necesitado y me has demostrado tu amor de una forma increíble intentando de todo para que esto salga bien muchas gracias.", 
                img: "foto1.jpeg" 
            },
            { 
                text: "Y te queria pedir perdon por todo lo que yo te he llegado a hacer pese a que eres una mujer maravillosa yo aveces puedo llegar a ser muy malo contigo, y se que los dos hemos cometido errores, pero mira que si yose que no es como deberia ser pero estoy muy agradecido porque apesar de todo me estoy dando cuenta poco a poco de lo que hago y que tengo que corregir entonces mejorare y seguire adelante contigo los dos. Te amo mucho muchote mi reina hermosa.", 
                img: "foto2.jpeg" 
            },
            { 
                text: "Y tal vez antes no había podido cambiar mucho por todos los líos en mi cabeza pero ya he ido entrando en razón y si aún me falta camino y cosas pero no quiero perderte y quiero seguir contigo el resto de mi vida salir adelante los dos aprender y arreglar las cosas los dos y se que me cuesta hablar de mis problemas pero me he empezado a liberar un poco más gracias a ti muchas gracias.", 
                img: "foto3.jpeg" 
            },
            { 
                text: "Este es un pequeño detalle que te estaba haciendo para este día de amor y amistad desde hace tiempo, tal vez no sea la gran cosa pero te quería dar algo relacionado con mi carrera y lo aprendí a programar guiándome de videos e IA para darte algo diferente. Aunque hoy sea sábado y no podamos estar juntos por que tengo clase y trabajas esos cortos y pequeños momentos a tu lado alegras mi vida.", 
                img: "foto4.jpeg" 
            },
            { 
                text: "No imaginé cómo cambiarían las cosas y dolor que se siente pero aun así te quería enviar este detalle, todo lo anterior lo hice con amor para ti, esto de aquí en adelante lo agregué después de todo lo que pasó, si gustas puedes leer esta parte con calma cuando estemos juntos y podamos hablar.", 
                img: "foto5.jpeg" 
            },
            { 
                text: "Sé que es difícil pero perdón no quiero dejar así las cosas esto no es para que te sientas mal es solo un detalle desde mi corazón todos los momentos que vivimos conocernos y enseñarnos no quiero que se acabe aprendamos y enseñemos otra vez los dos, viajes salidas de experiencia hermosas quiero vivir más.", 
                img: "foto6.jpeg" 
            },
            { 
                text: "Sé que han cambiado las cosas pero déjame demostrarte que los dos podemos cambiar te enamoraré día tras día, hagamos la propia historia aprendamos y mejoremos juntos.", 
                img: "foto7.jpeg" 
            },
            { 
                text: "Entiendo completamente que te debes amar a ti misma, perdón por las veces que la cagué no me justifico el estrés o mis propios líos me cegaron y no te di el trato que te mereces pero entendí mis errores y los cambiaré. Los viajes a Santa Marta, Cachipay, Guatavita y las salidas con mi familia fue donde fui feliz, tengo el sueño de ir al eje cafetero, Bojacá a bendecir las motos y muchos lugares más.", 
                img: "foto8.jpeg" 
            },
            { 
                text: "Te prometo que voy a poner de mi parte para demostrar cuánto te amo, me encanta el amor propio que tienes quiero que lo pensemos bien y lo que diga tu corazón. No dejemos que esto acabe ¿Por qué no avanzar juntos y ver más cosas en la vida? Te amo mucho.", 
                img: "foto9.jpeg" 
            },
            { 
                text: "Desde el fondo de mi corazón sé que no soy perfecto pero todos los días se aprende y se mejora. Quiero mejorar por mí y por ti, déjame aprender a tu lado. No diré más por aquí, el resto te lo diré yo mismo en persona.", 
                img: null 
            }
        ];

        // Precargar imágenes
        history.forEach(item => {
            if (item.img) {
                const imgPreload = new Image();
                imgPreload.src = item.img;
            }
        });

        let currentIndex = 0;
        const mainImg = document.getElementById('mainImg');
        const textContent = document.getElementById('textContent');
        const centerContainer = document.getElementById('centerContainer');

        function updateContent() {
            const currentItem = history[currentIndex];
            
            if (currentItem.img !== null) {
                centerContainer.classList.remove('final-stage');
                mainImg.src = currentItem.img;
            } else {
                centerContainer.classList.add('final-stage');
            }
            
            textContent.innerText = currentItem.text;
        }

        updateContent();

        let isTransitioning = false;
        function advanceStory(e) {
            if (e && (e.target === musicBtn || musicBtn.contains(e.target))) {
                return;
            }

            if (isTransitioning) return;
            isTransitioning = true;

            if (!isMusicPlaying) {
                toggleMusic();
            }

            centerContainer.classList.add('fade-out');

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % history.length;
                updateContent();
                centerContainer.classList.remove('fade-out');
                
                setTimeout(() => {
                    isTransitioning = false;
                }, 150);
            }, 300);
        }

        window.addEventListener('pointerdown', advanceStory);

        // --- 2. ESCENA 3D ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030206, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('webgl').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;

        // --- 3. GALAXIA DE ESTRELLAS CÁLIDAS ---
        function createGalaxy() {
            const count = 6500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            
            const colorYellow = new THREE.Color('#fef08a');
            const colorWhite = new THREE.Color('#ffffff');

            for (let i = 0; i < count; i++) {
                if (i < count / 2) {
                    const t = Math.random() * Math.PI * 2;
                    let x = 16 * Math.pow(Math.sin(t), 3);
                    let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    const scale = 0.38;
                    positions[i * 3] = x * scale + (Math.random() - 0.5) * 1.2;
                    positions[i * 3 + 1] = y * scale + 6 + (Math.random() - 0.5) * 1.2;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 2;
                } else {
                    const radius = Math.random() * 20;
                    const spinAngle = radius * 0.8;
                    const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

                    positions[i * 3] = Math.cos(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 1.2;
                    positions[i * 3 + 1] = -4 + (Math.random() - 0.5) * 2;
                    positions[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 1.2;
                }

                const mixedColor = Math.random() > 0.4 ? colorYellow : colorWhite;
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geometry, new THREE.PointsMaterial({
                size: 0.13,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            }));
        }

        const galaxyPoints = createGalaxy();
        scene.add(galaxyPoints);

        // --- 4. CREADOR DE TEXTURAS ---
        function generateSunflowerTexture(type = 'sunflower') {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const cx = 256;
            const cy = 256;

            if (type === 'sunflower') {
                const petals = 28;
                for (let i = 0; i < petals; i++) {
                    const angle = (i / petals) * Math.PI * 2;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(angle);

                    const grad = ctx.createLinearGradient(0, 0, 0, -220);
                    grad.addColorStop(0, '#f59e0b');
                    grad.addColorStop(0.5, '#fbbf24');
                    grad.addColorStop(1, '#fef08a');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, -40);
                    ctx.quadraticCurveTo(35, -130, 0, -230);
                    ctx.quadraticCurveTo(-35, -130, 0, -40);
                    ctx.fill();
                    ctx.restore();
                }

                const centerGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 75);
                centerGrad.addColorStop(0, '#271202');
                centerGrad.addColorStop(0.7, '#451a03');
                centerGrad.addColorStop(1, '#78350f');

                ctx.fillStyle = centerGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, 75, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fbbf24';
                for (let j = 0; j < 120; j++) {
                    const r = Math.sqrt(j) * 6.5;
                    const theta = j * 137.5 * (Math.PI / 180);
                    const x = cx + r * Math.cos(theta);
                    const y = cy + r * Math.sin(theta);
                    ctx.beginPath();
                    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                const petals = 24;
                for (let i = 0; i < petals; i++) {
                    const angle = (i / petals) * Math.PI * 2;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(angle);

                    const grad = ctx.createLinearGradient(0, 0, 0, -210);
                    grad.addColorStop(0, '#e2e8f0');
                    grad.addColorStop(1, '#ffffff');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, -35);
                    ctx.quadraticCurveTo(28, -120, 0, -220);
                    ctx.quadraticCurveTo(-28, -120, 0, -35);
                    ctx.fill();
                    ctx.restore();
                }

                const centerGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 55);
                centerGrad.addColorStop(0, '#fef08a');
                centerGrad.addColorStop(0.8, '#eab308');
                centerGrad.addColorStop(1, '#ca8a04');

                ctx.fillStyle = centerGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, 55, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // --- 5. AÑADIR GIRASOLES Y FLORES EN ÓRBITA ---
        const groupPhotos = new THREE.Group();
        scene.add(groupPhotos);

        const photoMeshes = [];
        const radiusRing = 13;
        const totalFlowers = 10;

        const textureSunflower = generateSunflowerTexture('sunflower');
        const textureDaisy = generateSunflowerTexture('daisy');

        for (let index = 0; index < totalFlowers; index++) {
            const angle = (index / totalFlowers) * Math.PI * 2;
            const geometry = new THREE.PlaneGeometry(3.5, 3.5);

            const texture = index % 3 === 0 ? textureDaisy : textureSunflower;

            const material = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.95
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.x = Math.cos(angle) * radiusRing;
            mesh.position.z = Math.sin(angle) * radiusRing;
            mesh.position.y = Math.sin(index) * 1.8;
            mesh.lookAt(0, mesh.position.y, 0);
            mesh.userData = { originalY: mesh.position.y };

            groupPhotos.add(mesh);
            photoMeshes.push(mesh);
        }

        // --- 6. ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);

            galaxyPoints.rotation.y += 0.0018;
            groupPhotos.rotation.y += 0.0022;

            const time = Date.now() * 0.0015;
            photoMeshes.forEach((mesh, i) => {
                mesh.position.y = mesh.userData.originalY + Math.sin(time + i) * 0.35;
                mesh.rotation.z += 0.003;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
